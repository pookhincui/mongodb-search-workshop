<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR — สแกนเล่น Search Demo</title>
<style>
  :root{
    --ink:#0E1420; --paper:#F5F7F5; --sem:#12B24A; --sem-dark:#0A7A34; --sem-soft:#E4F7EA;
    --font:"Sukhumvit Set","Leelawadee UI","Noto Sans Thai",Tahoma,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0; font-family:var(--font); color:var(--ink); background:var(--paper);
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:clamp(16px,3vw,32px)}
  .card{background:#fff; border:2px solid var(--sem); border-radius:20px;
    padding:clamp(20px,3vw,36px); max-width:520px; width:100%; text-align:center;
    box-shadow:0 6px 24px rgba(10,122,52,.12)}
  h1{margin:0 0 4px; font-size:clamp(22px,3.6vw,32px)}
  .lead{margin:0 0 20px; color:#3a4457; font-size:clamp(14px,1.8vw,17px)}
  #qr{display:inline-block; padding:14px; background:#fff; border-radius:14px;
    border:1px solid #e4e8ec; line-height:0}
  #qr svg{width:min(320px,72vw); height:auto}
  .url{margin:18px 0 8px; word-break:break-all}
  .url a{color:var(--sem-dark); font-weight:700; font-size:clamp(15px,2vw,18px); text-decoration:none}
  .url a:hover{text-decoration:underline}
  .row{display:flex; gap:10px; margin-top:14px}
  #u{flex:1; min-width:0; font-family:inherit; font-size:16px; padding:10px 12px;
    border:1.5px solid #cfd6dd; border-radius:10px; color:var(--ink)}
  .btn{min-height:44px; padding:10px 16px; border-radius:10px; cursor:pointer;
    font-family:inherit; font-size:15px; font-weight:600; border:1.5px solid var(--sem);
    background:var(--sem); color:#fff}
  .btn.ghost{background:#fff; color:var(--sem-dark)}
  .btn:active{transform:scale(.97)}
  .hint{margin-top:16px; font-size:13px; color:#8a93a3}
  .ok{color:var(--sem-dark); font-weight:600; min-height:18px; font-size:13px; margin-top:8px}
</style>
</head>
<body>
  <div class="card">
    <h1>สแกนเพื่อเล่นบนมือถือ 📱</h1>
    <p class="lead">เปิดกล้องมือถือส่องที่ QR แล้วลองพิมพ์คำค้นของคุณเองได้เลย</p>
    <div id="qr" aria-label="QR code"></div>
    <p class="url"><a id="link" href="#" target="_blank" rel="noopener"></a></p>
    <div class="row">
      <input id="u" type="url" inputmode="url" autocomplete="off" spellcheck="false">
      <button class="btn" id="gen" type="button">สร้าง QR</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="copy" type="button" style="flex:1">คัดลอกลิงก์</button>
    </div>
    <div class="ok" id="ok"></div>
    <p class="hint">ทำงานแบบออฟไลน์ 100% — QR สร้างในเบราว์เซอร์ ไม่เรียก API ภายนอก</p>
  </div>

<script src="qrcode.js"></script>
<script>
"use strict";
const DEFAULT_URL = "https://pookhincui.github.io/mongodb-search-workshop/";
const box = document.getElementById("qr");
const link = document.getElementById("link");
const input = document.getElementById("u");
const okEl = document.getElementById("ok");

function render(url){
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const qr = qrcode(0, "M");
  qr.addData(url);
  qr.make();
  box.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 12, scalable: true });
  link.textContent = url;
  link.href = url;
}

function flash(msg){
  okEl.textContent = msg;
  setTimeout(() => { okEl.textContent = ""; }, 2000);
}

input.value = DEFAULT_URL;
render(DEFAULT_URL);

document.getElementById("gen").addEventListener("click", () => {
  const v = input.value.trim();
  if(!v){ flash("ใส่ URL ก่อนนะ"); return; }
  render(v);
  flash("สร้าง QR ใหม่แล้ว");
});

document.getElementById("copy").addEventListener("click", async () => {
  const v = input.value.trim() || DEFAULT_URL;
  try{
    await navigator.clipboard.writeText(v);
    flash("คัดลอกลิงก์แล้ว ✓");
  }catch(e){
    input.focus(); input.select();
    flash("กด Ctrl/Cmd+C เพื่อคัดลอก");
  }
});
</script>
</body>
</html>
